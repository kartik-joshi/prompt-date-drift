[project]
name = "prompt-date-drift"
version = "0.1.0"
description = "Does the system-prompt date change a local model's answers?"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "requests", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datedrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
